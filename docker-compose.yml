name: algodecomer

services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: algodecomer
      POSTGRES_PASSWORD: algodecomer
      POSTGRES_DB: algodecomer
      TZ: America/Mexico_City
      PGTZ: America/Mexico_City
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algodecomer -d algodecomer"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  minio:
    profiles: ["storage"]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  minio_init:
    profiles: ["storage"]
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minio minio12345 &&
      mc mb --ignore-existing local/algodecomer
      "
    restart: "no"

volumes:
  postgres_data:
  minio_data:
