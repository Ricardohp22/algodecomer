name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Comprobar tipos
        run: pnpm typecheck

      - name: Levantar PostgreSQL con PostGIS
        run: docker compose up -d --wait

      - name: Migrar, sembrar y probar
        env:
          DATABASE_URL: postgres://algodecomer:algodecomer@localhost:5433/algodecomer
          NODE_ENV: test
        run: |
          pnpm db:setup
          pnpm test

      - name: Probar copia y restauración
        env:
          PGHOST: localhost
          PGPORT: "5433"
          PGUSER: algodecomer
          PGPASSWORD: algodecomer
          PGDATABASE: algodecomer
        run: bash scripts/verify-restore.sh
